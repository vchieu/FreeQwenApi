# LiteLLM bridge for the Claude Code -> FreeQwenApi -> Qwen Chat chain
# Start FreeQwenApi first: npm run start:cdp
# Then start LiteLLM: litellm --config examples/litellm/qwen_litellm.yaml --host 127.0.0.1 --port 4000

model_list:
  - model_name: qwen3.7-max
    litellm_params:
      model: openai/qwen3.7-max
      api_base: http://localhost:3264/api
      api_key: dummy-key

  - model_name: qwen3.7-plus
    litellm_params:
      model: openai/qwen3.7-plus
      api_base: http://localhost:3264/api
      api_key: dummy-key

  - model_name: qwen-coder-plus
    litellm_params:
      model: openai/qwen-coder-plus
      api_base: http://localhost:3264/api
      api_key: dummy-key

general_settings:
  master_key: "***"
